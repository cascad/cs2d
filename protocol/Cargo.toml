[package]
name = "protocol"
edition = "2024"
version = "0.1.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
# glam должен совпадать по minor с тем, что использует bevy (0.18 → glam 0.30.x),
# иначе glam::Vec2 в protocol ≠ bevy::math::Vec2 в клиенте/сервере.
glam = { version = "0.30.7", features = ["serde"] }

[features]
default = []