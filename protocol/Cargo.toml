[package]
name = "protocol"
edition = "2024"
version = "0.1.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
# glam должен совпадать по minor с тем, что использует bevy (0.18 → glam 0.30.x),
# иначе glam::Vec2 в protocol ≠ bevy::math::Vec2 в клиенте/сервере.
glam = { version = "0.30.7", features = ["serde"] }
# Пароли аккаунтов хранятся на диске → соль + SHA-256 (см. accounts.rs).
sha2 = "0.10"

[dev-dependencies]
# только для examples/map_preview — офлайн-композит карты в PNG
image = "0.25"

[features]
default = []