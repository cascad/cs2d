# Оверрайд «порт 80 занят чужим контейнером, но 443 свободен»: наш Caddy
# публикует ТОЛЬКО 443. Сертификат Let's Encrypt он получит через
# TLS-ALPN-челлендж на 443 (HTTP-челлендж на 80 недоступен — Caddy сам
# переключится на ALPN после неудачной попытки).
#
# Использование:
#   docker compose -f docker-compose.yml -f docker-compose.443only.yml up -d --build
#
# Нюанс: http://домен (порт 80) будет попадать в чужой контейнер — раздавайте
# ссылку строго с https://. И если сосед по 80 когда-нибудь займёт 443 —
# конфликт вернётся (тогда см. WEB_CLIENT.md, интеграция с чужим прокси).
services:
  web:
    ports: !override
      - "443:443"
      - "443:443/udp"
