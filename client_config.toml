# Конфиг клиента CS2D.
# ip/port — адрес по умолчанию для строки ручного ввода в меню.
ip = "127.0.0.1"
port = 6000

# name/password — аккаунт для авторизации и строки в таблице очков (Tab).
# Первый вход под именем регистрирует его (с паролем), далее пароль сверяется.
# Пустой пароль допустим. Для нескольких клиентов на одной машине задайте РАЗНЫЕ
# name (иначе второй получит «Аккаунт уже в игре»).
name = "player1"
password = ""

# [[servers]] — список серверов для мини-лобби. Каждый проверяется на
# активность: имя и число игроков подтягиваются с самого сервера (по TCP
# на том же порту, что и игра). name — запасное имя, если сервер офлайн.
[[servers]]
name = "Локальный сервер"
address = "127.0.0.1:6000"
