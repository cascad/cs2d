# Конфиг сервера CS2D.
# ip = "0.0.0.0"  — слушать на всех интерфейсах (LAN/интернет)
# ip = "127.0.0.1" — только локально
# port — UDP-порт (QUIC)
ip = "0.0.0.0"
port = 6000
webtransport_port = 6001
