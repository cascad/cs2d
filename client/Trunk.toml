[build]
dist = "../dist"
public_url = "/"
# ВСЕГДА release: `trunk serve` без этого пересобирает wasm в DEBUG и молча
# перезаписывает release-сборку. Debug-wasm не держит 60 fps → клиент не успевает
# тикать 66.7 Гц → lightyear уходит в спираль откатов («пинг 2 секунды», дёрганье).
release = true

[watch]
# Следим за кодом клиента и общих крейтов; assets не триггерят пересборку.
# digest'а сервера в списке НЕТ намеренно: его смена запускала бы полную
# release-пересборку wasm (минуты), а живой файл в dist/ теперь обновляет сам
# сервер при старте (см. server/src/wt_cert.rs::write_digest_file).
watch = [".", "../netproto", "../protocol"]

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false
