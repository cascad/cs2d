[package]
name = "client"
edition = "2024"
version = "0.1.0"

[[bin]]
name = "client"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.18" , features = [
    "bevy_asset",
    "bevy_sprite", 
    "bevy_render",
    "bevy_audio",   # звук (SFX + фоновая музыка)
    "vorbis",       # декодер OGG — в этот формат сконвертированы все наши клипы
    "png", "x11",
    ]}

bevy_quinnet = { version = "0.20.0", features = ["bincode-messages"] }

# protocol нужна ТОЛЬКО фича "quinnet"
protocol = { path = "../protocol", features = ["quinnet"] }

serde = { version = "1", features = ["derive"] }
toml = "0.8"