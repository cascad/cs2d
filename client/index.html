<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CS2D — подземелье в браузере</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚔%3C/text%3E%3C/svg%3E" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0c0a0e;
            overflow: hidden;
            font-family: system-ui, "Segoe UI", sans-serif;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }

        /* ── Стартовый экран ─────────────────────────────────────────── */
        #start {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0c0a0e;
        }
        #start .bg {
            position: absolute;
            inset: -24px;                    /* прячем размытые края */
            background: url("assets/ui/map_preview.jpg") center / cover no-repeat;
            filter: blur(5px) brightness(0.32) saturate(0.85);
        }
        #start .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center,
                        rgba(12, 10, 14, 0.10) 0%,
                        rgba(12, 10, 14, 0.55) 60%,
                        rgba(12, 10, 14, 0.92) 100%);
        }
        #card {
            position: relative;
            width: min(400px, calc(100vw - 48px));
            padding: 40px 36px 30px;
            border-radius: 14px;
            background: rgba(16, 13, 20, 0.82);
            border: 1px solid rgba(120, 200, 150, 0.14);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            text-align: center;
        }
        #card h1 {
            margin: 0;
            font-size: 44px;
            letter-spacing: 0.14em;
            color: #e8e2d4;
            text-shadow: 0 2px 18px rgba(70, 217, 122, 0.25);
        }
        #card .sub {
            margin: 6px 0 26px;
            font-size: 13px;
            letter-spacing: 0.08em;
            color: #8d8798;
            text-transform: uppercase;
        }
        #card input {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin: 0 0 12px;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(8, 6, 10, 0.7);
            color: #e8e2d4;
            font-size: 15px;
            outline: none;
        }
        #card input:focus { border-color: rgba(70, 217, 122, 0.5); }
        #card input::placeholder { color: #6d6678; }
        #play {
            width: 100%;
            margin-top: 6px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(180deg, #52e388, #2fae5e);
            color: #08130b;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.06em;
            cursor: pointer;
            transition: transform 0.06s ease, filter 0.12s ease;
        }
        #play:hover { filter: brightness(1.08); }
        #play:active { transform: scale(0.985); }
        #err {
            display: none;
            margin: 14px 0 0;
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(180, 50, 50, 0.16);
            border: 1px solid rgba(220, 80, 80, 0.35);
            color: #f0a8a8;
            font-size: 13px;
            white-space: pre-wrap;
        }
        #hint {
            margin: 16px 0 0;
            font-size: 12px;
            color: #6d6678;
            line-height: 1.5;
        }
        #boot {
            margin: 12px 0 0;
            font-size: 12px;
            color: #8d8798;
        }
        #fs {
            position: absolute;
            right: 16px;
            bottom: 14px;
            z-index: 1001;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(16, 13, 20, 0.7);
            color: #b9b2c4;
            font-size: 13px;
            cursor: pointer;
        }
        #fs:hover { color: #e8e2d4; border-color: rgba(255, 255, 255, 0.3); }
    </style>
    <link data-trunk rel="rust" data-bin="client" />
    <link data-trunk rel="copy-dir" href="../assets" />
    <!-- живой digest сервера для dev (`trunk serve`); в каталоге закоммичен
         только .gitkeep, чтобы сборка не падала на свежем клоне -->
    <link data-trunk rel="copy-dir" href="../certificates" />
    <script>
        // Autoplay-политика браузера: AudioContext создаётся в состоянии
        // "suspended", пока пользователь не совершил жест (клик/клавиша/тач).
        // cpal (bevy_audio) вызывает resume() один раз при старте — ДО жеста —
        // и больше не пытается, поэтому звука нет вовсе. Перехватываем
        // конструктор (классический скрипт в head выполняется раньше module-глю
        // Trunk, так что wasm получит наш патченный класс), копим контексты и
        // будим их на каждый жест (после сворачивания вкладки браузер может
        // снова приостановить контекст — слушатели не одноразовые).
        (function () {
            const contexts = [];
            for (const name of ["AudioContext", "webkitAudioContext"]) {
                const Orig = window[name];
                if (!Orig) continue;
                const Patched = function (...args) {
                    const ctx = new Orig(...args);
                    contexts.push(ctx);
                    console.info("[audio] AudioContext created, state=" + ctx.state);
                    return ctx;
                };
                Patched.prototype = Orig.prototype;
                Object.setPrototypeOf(Patched, Orig);
                window[name] = Patched;
            }
            const resume = () => {
                for (const ctx of contexts) {
                    if (ctx.state === "suspended") {
                        ctx.resume().then(
                            () => console.info("[audio] AudioContext resumed"),
                            (e) => console.warn("[audio] resume failed", e)
                        );
                    }
                }
            };
            for (const ev of ["pointerdown", "keydown", "touchstart"]) {
                window.addEventListener(ev, resume, { capture: true });
            }
            window.__cs2dAudioContexts = contexts;
        })();
    </script>
</head>
<body>
    <div id="start">
        <div class="bg"></div>
        <div class="vignette"></div>
        <div id="card">
            <h1>CS2D</h1>
            <div class="sub">подземелье &middot; мультиплеер &middot; браузер</div>
            <input id="name" type="text" maxlength="24" autocomplete="nickname"
                   placeholder="Имя (пусто — случайное)" />
            <input id="pass" type="password" autocomplete="current-password"
                   placeholder="Пароль (необязательно)" />
            <button id="play">ИГРАТЬ</button>
            <div id="err"></div>
            <div id="hint">Пароль закрепляет имя за тобой: первый вход регистрирует,
                дальше — сверяется. Без пароля имя может занять кто угодно.</div>
            <div id="boot">загрузка движка…</div>
        </div>
        <button id="fs" title="Полный экран">⛶ на весь экран</button>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        const overlay = $("start"), nameEl = $("name"), passEl = $("pass"),
              errEl = $("err"), bootEl = $("boot"), playBtn = $("play");

        nameEl.value = localStorage.getItem("cs2d_name") || "";

        // Готовность wasm: Trunk кидает событие, когда движок стартовал.
        window.addEventListener("TrunkApplicationStarted", () => {
            bootEl.style.display = "none";
        });

        playBtn.addEventListener("click", () => {
            const name = nameEl.value.trim().slice(0, 24);
            localStorage.setItem("cs2d_name", name);
            errEl.style.display = "none";
            // Сигнал wasm-клиенту (см. client/src/wasm_boot.rs js_start_request):
            // он подхватит имя/пароль и начнёт подключение. Этот же клик — жест
            // пользователя, разбудивший AudioContext (звук будет сразу).
            window.__cs2dStart = { name, password: passEl.value };
            overlay.style.display = "none";
        });
        nameEl.addEventListener("keydown", (e) => { if (e.key === "Enter") playBtn.click(); });
        passEl.addEventListener("keydown", (e) => { if (e.key === "Enter") playBtn.click(); });

        // Возврат на стартовый экран из игры (ошибка авторизации/таймаут/выход):
        // зовёт wasm (js_return_to_overlay), текст ошибки показываем в карточке.
        window.__cs2dShowOverlay = (msg) => {
            overlay.style.display = "flex";
            if (msg) {
                errEl.textContent = msg;
                errEl.style.display = "block";
            }
        };

        $("fs").addEventListener("click", () => {
            if (document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen().catch(() => {});
        });
    </script>
</body>
</html>
