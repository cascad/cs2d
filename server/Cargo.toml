[package]
name = "server"
edition = "2024"
version = "0.1.0"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.18", default-features = false, features = ["bevy_log"] }
netproto = { path = "../netproto" }
lightyear = { version = "0.26", features = [
    "server",
    "netcode",
    "udp",
    "input_native",
    "webtransport",
    "webtransport_self_signed",
] }
protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
bevy = { version = "0.18", default-features = false }
protocol = { path = "../protocol" }
# Тест unstable_ping собирает КЛИЕНТСКОЕ приложение против реального серверного
# бинаря (CARGO_BIN_EXE_server): нужна client-фича lightyear (фичи аддитивны).
lightyear = { version = "0.26", features = [
    "client",
    "netcode",
    "udp",
    "input_native",
] }